name: Update curated chart snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-curated-chart-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate dynamic curated chart snapshot
        run: node scripts/generate-curated-chart-snapshot.js

      - name: Validate dynamic curated chart snapshot
        run: node scripts/validate-hot-chart-snapshot.js

      - name: Commit snapshot update
        run: |
          if git diff --quiet -- curated-chart-snapshot.json; then
            echo "No chart snapshot changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curated-chart-snapshot.json
          git commit -m "Update curated chart snapshot"
          git push
